<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="112" fill="url(#shine)"/>
  <!-- branch line: main trunk with a side branch that merges back -->
  <path d="M150 128 V384" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M150 168 C150 214 196 214 196 256 C196 298 150 298 150 344" stroke="#fff" stroke-opacity=".55" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- commits -->
  <circle cx="150" cy="140" r="30" fill="#fff"/>
  <circle cx="196" cy="256" r="26" fill="#fff"/>
  <circle cx="150" cy="372" r="30" fill="#fff"/>
  <!-- the dock: stacked repos -->
  <rect x="226" y="116" width="170" height="48" rx="24" fill="#fff"/>
  <rect x="252" y="232" width="144" height="48" rx="24" fill="#fff" fill-opacity=".85"/>
  <rect x="226" y="348" width="170" height="48" rx="24" fill="#fff"/>
</svg>
